<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #f0f2f5; /* 明るい背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Helvetica Neue", Arial, sans-serif;
            color: #333;
        }

        .coin-tower-widget {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.08),
                        -10px -10px 30px rgba(255,255,255,0.8);
            text-align: center;
            width: 300px;
            position: relative;
            overflow: hidden; /* 影がはみ出さないように */
        }

        h2 {
            font-size: 1.8rem;
            color: #4a4a4a;
            margin-bottom: 15px;
        }

        .target-amount {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 30px;
        }

        .tower-container {
            width: 80px;
            height: 200px; /* タワーの最大高 */
            background-color: #e0e0e0;
            border-radius: 10px;
            margin: 0 auto 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid #dcdcdc;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
        }

        .coin-stack {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: #ffd700; /* ゴールド */
            transition: height 1.5s ease-out; /* ぎゅいんアニメーション */
            box-shadow: 0 -2px 5px rgba(255, 215, 0, 0.5); /* 光沢感 */
            border-top: 1px solid #e0b000;
        }

        /* 達成時の光るエフェクト */
        @keyframes glowing {
            0% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 0 -2px 5px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 -2px 10px rgba(255, 215, 0, 0.8); }
            100% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 0 -2px 5px rgba(255, 215, 0, 0.5); }
        }
        .coin-stack.completed {
            background: linear-gradient(to top, #ffd700, #ffeb82); /* 達成時グラデーション */
            animation: glowing 1.5s infinite alternate;
        }

        .current-amount {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff9500; /* オレンジ系の色 */
            display: block;
            margin-bottom: 5px;
        }

        .percentage {
            font-size: 1.2rem;
            color: #666;
        }
    </style>
</head>
<body>

<div class="coin-tower-widget">
    <h2>入金額</h2>
    <div class="target-amount">目標: ¥500,000</div>
    <div class="tower-container">
        <div id="coinStack" class="coin-stack"></div>
    </div>
    <span id="currentAmount" class="current-amount">¥0</span>
    <span id="percentage" class="percentage">0% 達成</span>
</div>

<script>
    window.onload = () => {
        const targetAmount = 500000;
        const currentAmount = 450000; // 現在の入金額をここに設定
        const percentage = Math.min((currentAmount / targetAmount) * 100, 100); // 100%超えは100%に丸める

        const coinStack = document.getElementById('coinStack');
        const currentAmountDisplay = document.getElementById('currentAmount');
        const percentageDisplay = document.getElementById('percentage');

        const towerHeight = 200; // CSSの.tower-containerのheightと合わせる
        const fillHeight = (percentage / 100) * towerHeight;

        // コインタワーのアニメーション
        coinStack.style.height = `${fillHeight}px`;

        // 金額とパーセンテージのカウントアップアニメーション
        let count = 0;
        let currentPercent = 0;
        const duration = 1500; // アニメーション時間
        const interval = duration / 60; // 60fpsと仮定

        let startTime = null;

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = (timestamp - startTime) / duration;

            if (progress < 1) {
                count = Math.min(Math.floor(progress * currentAmount), currentAmount);
                currentPercent = Math.min(Math.floor(progress * percentage), percentage);
                
                currentAmountDisplay.innerText = `¥${count.toLocaleString()}`;
                percentageDisplay.innerText = `${currentPercent}% 達成`;
                requestAnimationFrame(animate);
            } else {
                currentAmountDisplay.innerText = `¥${currentAmount.toLocaleString()}`;
                percentageDisplay.innerText = `${percentage}% 達成`;
                
                // 100%達成時のエフェクト
                if (percentage >= 100) {
                    coinStack.classList.add('completed');
                }
            }
        }
        requestAnimationFrame(animate);
    };
</script>

</body>
</html>
